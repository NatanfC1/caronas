@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1C2E; --surface:#0F273D; --ink:#E8F1F4; --muted:#8EA6B8; --line:#1D3B55;
  --accent:#7EE07A; --accent-ink:#0A1C2E; --chip:#123A3A; --chip-ink:#CDF6D2;
  --ok:#4CC38A; --warn:#F0A04B; --bad:#F2726B; --okbg:#123326; --badbg:#3A1C1E; --warnbg:#3A2A16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1C2E; --surface:#0F273D; --ink:#E8F1F4; --muted:#8EA6B8; --line:#1D3B55;
  --accent:#7EE07A; --accent-ink:#0A1C2E; --chip:#123A3A; --chip-ink:#CDF6D2;
  --ok:#4CC38A; --warn:#F0A04B; --bad:#F2726B; --okbg:#123326; --badbg:#3A1C1E; --warnbg:#3A2A16; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 60px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:1.7rem;line-height:1.05}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.route{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:4px}
.sync{font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 .95rem var(--body);padding:9px 6px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:.82rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:150px;resize:vertical;font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav h2{font-size:1.25rem;text-align:center;flex:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stat .val{font-family:var(--display);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:10px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}
.note{font-size:.82rem;color:var(--muted)}
.days{display:flex;flex-direction:column;gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day.off{opacity:.62}
.dayhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dayhead h3{font-size:1.25rem}
.dayhead .date{color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.hoje{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill.full{background:var(--badbg);color:var(--bad);border-color:transparent}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.spacer{flex:1}
.leg{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:start}
.leg .lname{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.95rem;padding-top:6px}
.leg .lname small{display:block;font-family:var(--body);font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);font-size:.75rem}
.seats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:440px){.seats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.seat{min-height:36px;border-radius:8px;display:flex;align-items:center;min-width:0}
.seat.taken{background:var(--chip);color:var(--chip-ink);padding:0 4px 0 10px;font-weight:600;justify-content:space-between;gap:4px}
.seat.taken span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat.taken.over{background:var(--badbg);color:var(--bad)}
.seat.taken button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 6px;opacity:.7}
.seat select,.seat input{width:100%;height:36px;border-style:dashed;color:var(--muted);background:transparent}
.dayfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dayfoot input{flex:1;min-width:140px;font-size:.85rem}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:.85rem;color:var(--muted);cursor:pointer}
details.tool{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.tool summary{cursor:pointer;font-weight:600}
details.tool[open] summary{margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.preview{font-size:.88rem;display:flex;flex-direction:column;gap:4px;margin-top:8px}
.people{display:flex;flex-direction:column;gap:10px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.person .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.person .ph h3{font-size:1.25rem}
.person .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-variant-numeric:tabular-nums}
.person .nums div{font-size:.8rem;color:var(--muted)}
.person .nums b{display:block;font-family:var(--display);font-size:1.25rem;color:var(--ink)}
.person .nums b.neg{color:var(--bad)} .person .nums b.pos{color:var(--ok)}
.hist{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;font-size:.9rem;z-index:20}
.copybox{width:100%;margin-top:8px}
.brandbar{position:relative;overflow:hidden;border-radius:14px;padding:16px 18px 14px;color:#fff;display:flex;flex-direction:column;gap:10px;
  background:radial-gradient(120% 140% at 0% 0%,rgba(55,175,135,.28),transparent 55%),radial-gradient(90% 120% at 100% 100%,rgba(199,243,95,.12),transparent 60%),var(--brand-dark)}
.brandbar::after{content:none;position:absolute;right:-46px;top:50%;width:190px;height:190px;transform:translateY(-50%);background:rgba(255,255,255,.09);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;pointer-events:none}
.blogo{margin:0;line-height:0;position:relative;z-index:1}
.blogo img{height:58px;width:auto;max-width:100%}
.approw .sync{margin-left:auto}
.brandrow{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.logo{display:inline-block;width:46px;height:46px;flex:none;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.logo.sm{width:18px;height:18px}
.brandname.nfc{font-size:1.55rem!important;color:#fff;margin:0;font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:.02em;line-height:1.05}
.brandname.nfc b{color:var(--brand-cyan);font-weight:700}
.brandname .tag{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#C9D6E2}
.approw{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.approw h1{font-size:1.45rem;color:#fff}
.brandbar .route{background:transparent;border:1px solid var(--brand-cyan);color:var(--brand-pale);font-family:var(--body);font-weight:600;font-size:.72rem;letter-spacing:.08em;padding:2px 9px;border-radius:99px}
.brandbar .sync{position:relative;z-index:1;color:var(--brand-pale);font-size:.75rem}
.corrigindo{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-color:var(--accent);background:var(--chip);color:var(--chip-ink)}
.relcard{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tabs{gap:2px}.tabs button{white-space:nowrap;padding:9px 4px;flex:1 1 auto;min-width:0}
@media (max-width:440px){.tabs button{font-size:.74rem;padding:8px 2px}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.card .seg{background:var(--bg)}
.seg button{border:0;background:transparent;color:var(--muted);font:600 .92rem var(--body);padding:8px 6px;border-radius:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
.seg button small{font-weight:500;font-size:.72rem;font-variant-numeric:tabular-nums;opacity:.85}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.wa{display:flex;flex-direction:column;gap:10px}
.wa details.tool{background:var(--bg)}
.painel{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:4px 8px;align-items:center;font-size:.8rem;max-width:380px}
.painel .ph{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.painel b{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.painel input{width:100%;padding:5px 8px;font-variant-numeric:tabular-nums}
.foot{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:.75rem;text-align:center;padding-top:6px}
h1,h2,h3{letter-spacing:0}
.stat .val{font-size:1.35rem}
.dayhead h3,.person .ph h3{font-size:1.08rem}
.leg .lname{font-size:.78rem;padding-top:8px}
.weeknav h2{font-size:1.05rem}
.person .nums b{font-size:1.05rem}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button{font-size:.85rem}
.tick{color:var(--ok);font-weight:700}
.cons{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.cons label{display:inline-flex;align-items:center;gap:5px}
.cons input{width:72px;padding:5px 7px}
.erow.ab{grid-template-columns:60px 1fr auto}
.payform{display:flex;flex-direction:column;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.paydays{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.chk.pd{color:var(--ink);font-variant-numeric:tabular-nums}
.chk.pd em{color:var(--muted);font-style:normal;font-size:.8rem}
.ext{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.erow{display:grid;grid-template-columns:90px 1fr auto auto;gap:8px;align-items:center;font-size:.88rem;font-variant-numeric:tabular-nums}
.tarifas{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto auto;gap:8px;align-items:end;padding-bottom:8px;border-bottom:1px solid var(--line)}
.trow.novo{border-bottom:0;padding-bottom:0}
.trow label{display:flex;flex-direction:column;gap:3px;font-size:.75rem;color:var(--muted);font-weight:600}
.trow input{width:100%}
.trow .note{padding-bottom:8px;white-space:nowrap}
@media (max-width:560px){.trow{grid-template-columns:1fr 1fr}.trow>input{grid-column:1/-1}}
.calc{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: no-preference){.seat.taken{transition:background .15s}}

/* celular: compacto, lado a lado */
@media (max-width:560px){
  .wrap{gap:10px}
  .card{padding:12px}
  .stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .stat .lbl{font-size:min(.58rem,2.5vw);letter-spacing:.04em}
  .stat .val{font-size:min(.92rem,3.6vw);white-space:nowrap}
  .stat .note{font-size:.62rem}
  .bar{margin-top:8px;height:6px}
  .note{font-size:.74rem}
  .weeknav h2{font-size:.92rem}
  .day{padding:10px 12px;gap:8px}
  .dayhead{flex-wrap:nowrap;gap:6px;min-width:0}
  .dayhead h3{font-size:.98rem}
  .dayhead .date{font-size:.8rem}
  .dayhead .pill{font-size:.56rem;padding:1px 6px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .dayhead h3,.dayhead .date,.dayhead .chk{flex:none}
  .tabs button{font-size:min(.74rem,3.3vw)!important}
  .dayhead .chk{font-size:.74rem;white-space:nowrap}
  .leg{grid-template-columns:44px minmax(0,1fr);gap:6px}
  .leg .lname{font-size:.68rem;padding-top:5px}
  .leg .lname small{font-size:.66rem}
  .seats{display:flex;flex-wrap:wrap;gap:5px}
  .seat{min-height:30px;flex:0 1 auto;min-width:0}
  .seat:empty{display:none}
  .seat.taken{padding:0 1px 0 8px;font-size:.82rem;max-width:100%}
  .seat.taken span{max-width:8.5em}
  .seat.taken button{padding:3px 6px;font-size:1rem}
  .seat select{height:30px;width:auto;min-width:80px;font-size:.78rem;padding:2px 6px}
  .seat input{height:30px;width:118px;font-size:.8rem}
  .cons{flex-wrap:nowrap;gap:6px;font-size:.76rem}
  .painel{grid-template-columns:40px minmax(0,1fr) minmax(0,1fr);gap:4px 6px}
  .painel input{padding:4px 6px;font-size:.8rem}
  .painel .ph{font-size:.58rem}
  .seg button{font-size:.82rem;padding:6px 4px}
  .seg button small{font-size:.64rem}
  .cons input{width:52px;padding:3px 5px;font-size:.8rem}
  .dayfoot{font-size:.74rem;gap:6px}
  .dayfoot input{font-size:.78rem;padding:5px 7px}
  .person{padding:10px 12px}
  .person .nums b{font-size:.92rem}
  .person .nums div{font-size:.7rem}
  .erow{grid-template-columns:72px 1fr auto auto;font-size:.78rem}
}

/* barra de navegação inferior */
.tabs.tabbar{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin:0;border:0;border-top:1px solid var(--line);border-radius:0;
  background:var(--brand-dark);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(13,38,62,.2)}
.tabs.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px!important;border-radius:10px;background:transparent!important;color:#8FA6B8!important;font:600 .68rem var(--body)!important;min-width:0;white-space:nowrap}
.tabs.tabbar button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs.tabbar button[aria-selected="true"]{color:var(--brand-cyan)!important}
.tabs.tabbar button[aria-selected="true"] svg{background:rgba(126,224,122,.16);border-radius:999px;padding:2px 10px;width:44px;box-sizing:border-box;height:26px}

<script>
const DIAS=['Segunda','Terça','Quarta','Quinta','Sexta'];
const DEFAULT={config:{kmTrecho:32,consumo:12.8,gasolina:6.10,vagas:4,horaIda:'07h30',horaVolta:'17h00',mostrarVagas:false,rodape:'🚨Tenho vagas de Segunda a Sexta\n➡️Interessados favor chamar no privado'},tarifas:[{id:'padrao',nome:'Padrão',valorDia:28,valorTrecho:14}],pessoas:[],viagens:{},pagamentos:[],abastecimentos:[]};
function carregar(o){const x=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(JSON.stringify(o||{})));
  x.config=Object.assign({},DEFAULT.config,(o&&o.config)||{});
  if(!o||!Array.isArray(o.tarifas)||!o.tarifas.length){x.tarifas=[{id:'padrao',nome:'Padrão',valorDia:+(x.config.valorDia??28),valorTrecho:+(x.config.valorTrecho??14)}]}
  x.pessoas.forEach(p=>{if(!p.tarifa||(p.tarifa!=='proprio'&&!x.tarifas.some(t=>t.id===p.tarifa)))p.tarifa=x.tarifas[0].id});return x}
let S=carregar(null);
let wSem=mondayOf(new Date()),mes=new Date().toISOString().slice(0,7),extOpen=null,vagasOpen=false,tab='semana', semana=mondayOf(new Date()), importPreview=null, novaPessoaSlot=null, payOpen=null, editOpen=null, copyText=null;
try{const h=location.hash.slice(1); if(['semana','pessoas','gasolina','historico','ajustes'].includes(h)) tab=h;}catch(e){}

/* ---------- datas ---------- */
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fromIso(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function mondayOf(d){d=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=d.getDay();if(w===6)d.setDate(d.getDate()+2);else if(w===0)d.setDate(d.getDate()+1);else d.setDate(d.getDate()-(w-1));return d}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function ddmm(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')}
const HOJE=iso(new Date());mes=HOJE.slice(0,7);

/* ---------- utilidades ---------- */
const brl=v=>(Math.round(v*100)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const uid=()=>Math.random().toString(36).slice(2,10);
const pessoa=id=>S.pessoas.find(p=>p.id===id);
const nome=id=>pessoa(id)?.nome||'?';
function dia(key){if(!S.viagens[key])S.viagens[key]={ida:[],volta:[],obs:'',off:false};return S.viagens[key]}
function precoEm(k){const a=S.abastecimentos.filter(x=>x.data<=k&&x.preco>0).sort((a,b)=>b.data.localeCompare(a.data))[0];return a?a.preco:S.config.gasolina}
function mediaConsumo(campo){let km=0,l=0,n=0;Object.keys(S.viagens).sort().slice(-60).forEach(k=>{const v=S.viagens[k];if(v.off)return;(campo?[campo]:['consIda','consVolta']).forEach(f=>{if(v[f]>0){const d=kmT(k,f==='consIda'?'ida':'volta');km+=d;l+=d/v[f];n++}})});
  return {n,media:n?km/l:S.config.consumo}}
const fmtKml=x=>x.toFixed(1).replace('.',',')+' km/l';
function kmT(k,leg){const v=S.viagens[k];const x=v&&v[leg==='ida'?'kmIda':'kmVolta'];return x>0?+x:S.config.kmTrecho}
function kmDia(k){const v=S.viagens[k];if(v&&v.off)return 0;return kmT(k,'ida')+kmT(k,'volta')}
function consTrecho(k,leg){const v=S.viagens[k];const c=v&&v[leg==='ida'?'consIda':'consVolta'];return c>0?+c:mediaConsumo().media}
function custoTrecho(k,leg){return kmT(k,leg)/consTrecho(k,leg)*precoEm(k)}
function custoDiaK(k){const v=S.viagens[k];if(v&&v.off)return 0;return custoTrecho(k,'ida')+custoTrecho(k,'volta')}
function custoDia(){return 2*S.config.kmTrecho/mediaConsumo().media*precoEm(HOJE)}
function tarifaDe(p){return S.tarifas.find(t=>t.id===p?.tarifa)||S.tarifas[0]}
function valores(pid){const p=pessoa(pid);if(p&&p.tarifa==='proprio')return {d:+p.valorDia||0,t:+p.valorTrecho||0};const t=tarifaDe(p);return {d:+t.valorDia||0,t:+t.valorTrecho||0}}
function rotuloTarifa(p){if(p.tarifa==='proprio')return 'Valor próprio · '+brl(+p.valorDia||0)+' / '+brl(+p.valorTrecho||0);const t=tarifaDe(p);return t.nome+' · '+brl(t.valorDia)+' / '+brl(t.valorTrecho)}
function cobranca(v,pid){if(!v||v.off)return 0;const a=v.ida.includes(pid),b=v.volta.includes(pid);if(!a&&!b)return 0;const x=valores(pid);return a&&b?x.d:x.t}
function receitaDia(v){if(!v||v.off)return 0;const ids=new Set([...v.ida,...v.volta]);let t=0;ids.forEach(id=>t+=cobranca(v,id));return t}
function devido(pid,ate){let t=0;for(const k in S.viagens){if(ate&&k>ate)continue;t+=cobranca(S.viagens[k],pid)}return t}
const DIAS_CURTO=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function extrato(pid){
  const dias=Object.keys(S.viagens).sort().map(k=>{const v=S.viagens[k];const c=cobranca(v,pid);if(!c)return null;const a=v.ida.includes(pid),b=v.volta.includes(pid);return {k,valor:c,pago:0,tipo:a&&b?'ida e volta':a?'só ida':'só volta'}}).filter(Boolean);
  const byK={};dias.forEach(d=>byK[d.k]=d);let pool=0;
  S.pagamentos.filter(x=>x.pid===pid).sort((a,b)=>a.data.localeCompare(b.data)).forEach(x=>{let r=x.valor;
    (x.dias||[]).slice().sort().forEach(k=>{const d=byK[k];if(!d||r<=0)return;const u=Math.min(r,d.valor-d.pago);d.pago+=u;r-=u});pool+=r});
  dias.forEach(d=>{if(pool<=0)return;const u=Math.min(pool,d.valor-d.pago);d.pago+=u;pool-=u});
  let aberto=0,aVencer=0,adiantado=0;dias.forEach(d=>{const r=d.valor-d.pago;if(d.k<=HOJE)aberto+=r;else{aVencer+=r;adiantado+=d.pago}});
  return {dias,aberto:Math.max(0,aberto),aVencer,adiantado,credito:Math.max(0,pool)};
}
function pago(pid){return S.pagamentos.filter(p=>p.pid===pid).reduce((a,p)=>a+p.valor,0)}
function semanaKeys(seg){return [0,1,2,3,4].map(i=>iso(addDays(seg,i)))}
function findByName(n){const k=norm(n);return S.pessoas.find(p=>norm(p.nome)===k)||S.pessoas.find(p=>norm(p.nome).split(' ')[0]===k)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
async function copiar(txt){try{await navigator.clipboard.writeText(txt);toast('Copiado');copyText=null}catch(e){copyText=txt;render();toast('Selecione e copie o texto abaixo')}}

/* ---------- armazenamento ---------- */
let docRef=null, timer=null, writing=false, again=false, lastSaved='';
const LS='caronas-v1';
function loadLocal(){try{const r=localStorage.getItem(LS);if(r)S=carregar(JSON.parse(r))}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function salvar(){saveLocal();if(!docRef)return;clearTimeout(timer);timer=setTimeout(flush,500)}
async function flush(){if(writing){again=true;return}writing=true;const js=JSON.stringify(S);try{await docRef.set(JSON.parse(js));lastSaved=js;setSync(true)}catch(e){setSync(false,'Não salvou na nuvem: '+(e.message||e.code))}writing=false;if(again){again=false;flush()}}
function setSync(ok,msg){document.getElementById('sync').textContent=msg||'Salvo neste celular'}
async function iniciar(){
  loadLocal();render();setSync(false,'Salvo neste celular');
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
  return;
  let db=null;
  if(!db){setSync(false);return}
  docRef=db.doc('caronas/estado');
  try{
    const snap=await docRef.get();
    if(snap.exists){S=carregar(snap.data());lastSaved=JSON.stringify(S);saveLocal();render()}
    else if(S.pessoas.length){await flush()}
    setSync(true);
    docRef.onSnapshot(s=>{if(!s.exists||writing)return;const js=JSON.stringify(s.data());if(js===lastSaved||js===JSON.stringify(S))return;if(document.activeElement&&document.activeElement.matches('input,textarea'))return;S=carregar(s.data());lastSaved=js;saveLocal();render()},()=>setSync(false));
  }catch(e){docRef=null;setSync(false)}
}

/* ---------- WhatsApp ---------- */
const DIA_IDX={segunda:0,terca:1,quarta:2,quinta:3,sexta:4};
function lerWhats(txt){
  const out=[];let nomes=[],ida=null,volta=null;
  for(let raw of txt.split(/\r?\n/)){
    const l=raw.trim();if(!l)continue;const n=norm(l);
    if(/^\d{1,2}:\d{2}/.test(n)||n==='hoje')continue;
    if(n==='ida'){ida=nomes;nomes=[];continue}
    if(n==='volta'){volta=nomes;nomes=[];continue}
    const d=Object.keys(DIA_IDX).find(k=>n.startsWith(k));
    if(d&&n.split(/\s+/).length<=2){out.push({idx:DIA_IDX[d],ida:ida||[],volta:volta||[]});ida=volta=null;nomes=[];continue}
    nomes=nomes.concat(l.split(/[\s,;]+/).filter(Boolean));
  }
  return out;
}
function textoSemana(seg){seg=seg||semana;
  return semanaKeys(seg).map((k,i)=>{const v=S.viagens[k];if(!v||v.off)return null;
    return [v.ida.map(nome).join(' '),'Ida',v.volta.map(nome).join(' '),'Volta',DIAS[i]].join('\n')}).filter(Boolean).join('\n\n');
}
function msgCobranca(p){
  const e=extrato(p.id);const fimSem=iso(addDays(mondayOf(new Date()),4));
  const lim=p.modo==='semana'?(fimSem>HOJE?fimSem:HOJE):HOJE;
  const ds=e.dias.filter(d=>d.k<=lim&&d.valor-d.pago>0.009);
  const pn=p.nome.split(' ')[0];
  if(!ds.length)return `Oi, ${pn}! Suas caronas estão todas pagas até agora. Obrigado!`;
  const tot=ds.reduce((a,d)=>a+d.valor-d.pago,0);
  return `Oi, ${pn}! Segue o resumo das caronas em aberto:\n`+ds.map(d=>`${DIAS_CURTO[fromIso(d.k).getDay()]} ${ddmm(fromIso(d.k))}: ${d.tipo} — ${brl(d.valor-d.pago)}${d.pago>0.009?' (restante)':''}`).join('\n')+`\nTotal: ${brl(tot)}\nObrigado!`;
}

function minutos(h){const m=String(h||'').match(/(\d{1,2})\s*[h:]\s*(\d{0,2})/i);return m?(+m[1])*60+(+(m[2]||0)):null}
function msgVagas(seg){seg=seg||semana;
  const c=S.config,cap=c.vagas,agora=new Date(),nowMin=agora.getHours()*60+agora.getMinutes(),amanha=iso(addDays(agora,1));
  const blocos=[];
  semanaKeys(seg).forEach((k,i)=>{if(k<HOJE)return;const v=S.viagens[k];if(v&&v.off)return;
    const linhas=[];
    [['ida','Piumhi','Capitólio',c.horaIda],['volta','Capitólio','Piumhi',c.horaVolta]].forEach(([leg,de,para,hora])=>{
      const livres=cap-((v&&v[leg])||[]).length;if(livres<=0)return;
      if(k===HOJE){const mm=minutos(hora);if(mm!==null&&mm<=nowMin)return}
      linhas.push(`📍 ${de} ➡️ ${para}: ${hora}`+(c.mostrarVagas?` (${livres} vaga${livres>1?'s':''})`:''))});
    if(linhas.length)blocos.push(`${DIAS[i].toUpperCase()} ${ddmm(fromIso(k))}`+(k===HOJE?'  HOJE':k===amanha?'  AMANHÃ':'')+'\n'+linhas.join('\n'))});
  if(!blocos.length)return '';
  return 'OFEREÇO CARONA\n'+blocos.join('\n\n')+(c.rodape?'\n'+c.rodape:'');
}

function cartaoDia(k,i){

    const livres=Math.max(0,cap-ids.length);

    return `<div class="leg"><div class="lname">${leg==='ida'?'Ida':'Volta'}${st}</div><div class="seats">${seats}</div></div>`;

      <b>Ida</b><input type="number" inputmode="decimal" step="0.1" min="0" id="ki-${k}" data-act="cons" data-k="${k}" data-f="kmIda" value="${v.kmIda||''}" placeholder="${S.config.kmTrecho}" aria-label="Km rodados na ida"><input type="number" inputmode="decimal" step="0.1" min="0" id="ci-${k}" data-act="cons" data-k="${k}" data-f="consIda" value="${v.consIda||''}" placeholder="${mediaConsumo().media.toFixed(1)}" aria-label="Média km/l na ida">
      <b>Volta</b><input type="number" inputmode="decimal" step="0.1" min="0" id="kv-${k}" data-act="cons" data-k="${k}" data-f="kmVolta" value="${v.kmVolta||''}" placeholder="${S.config.kmTrecho}" aria-label="Km rodados na volta"><input type="number" inputmode="decimal" step="0.1" min="0" id="cv-${k}" data-act="cons" data-k="${k}" data-f="consVolta" value="${v.consVolta||''}" placeholder="${mediaConsumo().media.toFixed(1)}" aria-label="Média km/l na volta"></div>`}
    <div class="dayfoot"><span>Entrou ${brl(rec)} · gasolina ${brl(v.off?0:cd)}${v.off?'':' · '+String(Math.round(kmDia(k)*10)/10).replace('.',',')+' km'}</span>
    <input type="text" id="obs-${k}" data-act="obs" data-k="${k}" value="${esc(v.obs||'')}" placeholder="Observação (ex.: Ithalo paga sexta)"></div></section>`;

/* ---------- backup XML ---------- */
function xa(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'&#10;')}
function attrs(o,keys){return keys.filter(k=>o[k]!==undefined&&o[k]!==null&&o[k]!=='').map(k=>` ${k}="${xa(o[k])}"`).join('')}
function paraXML(){
  const c=S.config,L=[];
  L.push('<?xml version="1.0" encoding="UTF-8"?>');
  L.push(`<caronas versao="1" exportado="${new Date().toISOString()}">`);
  L.push(`  <config${attrs(c,['kmTrecho','consumo','gasolina','vagas','horaIda','horaVolta','mostrarVagas'])}>`);
  L.push(`    <rodape>${xa(c.rodape)}</rodape>`);
  L.push('  </config>');
  L.push('  <tarifas>');S.tarifas.forEach(t=>L.push(`    <tarifa${attrs(t,['id','nome','valorDia','valorTrecho'])}/>`));L.push('  </tarifas>');
  L.push('  <pessoas>');S.pessoas.forEach(p=>L.push(`    <pessoa${attrs(p,['id','nome','modo','fixo','tarifa','valorDia','valorTrecho'])}/>`));L.push('  </pessoas>');
  L.push('  <viagens>');Object.keys(S.viagens).sort().forEach(k=>{const v=S.viagens[k];
    L.push(`    <dia data="${k}"${v.off?' off="true"':''}${attrs(v,['consIda','consVolta','kmIda','kmVolta'])}>`);
    ['ida','volta'].forEach(leg=>L.push(`      <${leg}>${(v[leg]||[]).map(id=>`<p id="${xa(id)}"/>`).join('')}</${leg}>`));
    if(v.obs)L.push(`      <obs>${xa(v.obs)}</obs>`);
    L.push('    </dia>')});L.push('  </viagens>');
  L.push('  <pagamentos>');S.pagamentos.forEach(x=>{L.push(`    <pagamento${attrs(x,['id','pid','data','valor','obs'])}>${(x.dias||[]).map(k=>`<d>${k}</d>`).join('')}</pagamento>`)});L.push('  </pagamentos>');
  L.push('  <abastecimentos>');S.abastecimentos.forEach(a=>L.push(`    <abastecimento${attrs(a,['id','data','valor','preco','litros','km'])}/>`));L.push('  </abastecimentos>');
  L.push('</caronas>');
  return L.join('\n');
}
function deXML(txt){
  const doc=new DOMParser().parseFromString(txt,'application/xml');
  if(doc.querySelector('parsererror')||!doc.documentElement||doc.documentElement.nodeName!=='caronas')throw new Error('xml');
  const num=v=>v===null||v===''?undefined:(isNaN(+v)?v:+v);
  const at=(el,keys,nums)=>{const o={};keys.forEach(k=>{const v=el.getAttribute(k);if(v===null)return;o[k]=nums.includes(k)?num(v):v==='true'?true:v==='false'?false:v});return o};
  const r=doc.documentElement,o={};
  const cf=r.querySelector('config');
  o.config=cf?at(cf,['kmTrecho','consumo','gasolina','vagas','horaIda','horaVolta','mostrarVagas'],['kmTrecho','consumo','gasolina','vagas']):{};
  const rod=cf&&cf.querySelector('rodape');if(rod)o.config.rodape=rod.textContent;
  o.tarifas=[...r.querySelectorAll('tarifas > tarifa')].map(e=>at(e,['id','nome','valorDia','valorTrecho'],['valorDia','valorTrecho']));
  o.pessoas=[...r.querySelectorAll('pessoas > pessoa')].map(e=>at(e,['id','nome','modo','fixo','tarifa','valorDia','valorTrecho'],['valorDia','valorTrecho']));
  o.viagens={};r.querySelectorAll('viagens > dia').forEach(e=>{const v={ida:[...e.querySelectorAll('ida > p')].map(p=>p.getAttribute('id')),volta:[...e.querySelectorAll('volta > p')].map(p=>p.getAttribute('id')),obs:e.querySelector('obs')?.textContent||'',off:e.getAttribute('off')==='true'};
    ['consIda','consVolta','kmIda','kmVolta'].forEach(f=>{const n=num(e.getAttribute(f));if(n>0)v[f]=n});o.viagens[e.getAttribute('data')]=v});
  o.pagamentos=[...r.querySelectorAll('pagamentos > pagamento')].map(e=>Object.assign(at(e,['id','pid','data','valor','obs'],['valor']),{dias:[...e.querySelectorAll('d')].map(d=>d.textContent)}));
  o.abastecimentos=[...r.querySelectorAll('abastecimentos > abastecimento')].map(e=>at(e,['id','data','valor','preco','litros','km'],['valor','preco','litros','km']));
  return o;
}
function lerBackup(txt){txt=String(txt).trim();const o=txt.startsWith('<')?deXML(txt):JSON.parse(txt);if(!o.config||!Array.isArray(o.pessoas))throw new Error('formato');return carregar(o)}

function baixar(nomeArq,txt){const b=new Blob([txt],{type:'application/xml'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download=nomeArq;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Arquivo baixado')}
/* ---------- relatório mensal ---------- */
function n2(x){return (Math.round((+x||0)*100)/100).toFixed(2)}
function relatorioXML(m){
  const [y,mm]=m.split('-').map(Number);const ini=m+'-01',fim=iso(new Date(y,mm,0));const dentro=k=>k>=ini&&k<=fim;
  const L=['<?xml version="1.0" encoding="UTF-8"?>',`<relatorio_mensal mes="${m}" gerado="${new Date().toISOString()}" empresa="NFC Soluções em Tecnologia e Infraestrutura">`];
  const ks=Object.keys(S.viagens).filter(dentro).sort();
  let ger=0,est=0,dias=0,kmMes=0;const cI=[],cV=[];
  const linhasDia=ks.map(k=>{const v=S.viagens[k];const rec=receitaDia(v),cu=custoDiaK(k);if(!v.off){ger+=rec;est+=cu;dias++;kmMes+=kmDia(k);if(v.consIda>0)cI.push(+v.consIda);if(v.consVolta>0)cV.push(+v.consVolta)}
    return `    <dia data="${k}" dia_semana="${DIAS_CURTO[fromIso(k).getDay()]}" nao_fui="${v.off?'sim':'nao'}" ida="${xa(v.ida.map(nome).join(', '))}" volta="${xa(v.volta.map(nome).join(', '))}" passageiros_ida="${v.ida.length}" passageiros_volta="${v.volta.length}" caronas="${n2(rec)}" gasolina_estimada="${n2(cu)}" resultado="${n2(rec-cu)}" consumo_ida="${v.consIda||''}" consumo_volta="${v.consVolta||''}" km_ida="${v.off?'':kmT(k,'ida')}" km_volta="${v.off?'':kmT(k,'volta')}" preco_litro="${n2(precoEm(k))}"${v.obs?` obs="${xa(v.obs)}"`:''}/>`});
  const abs=S.abastecimentos.filter(a=>dentro(a.data)).sort((a,b)=>a.data.localeCompare(b.data));
  const gasto=abs.reduce((s,a)=>s+a.valor,0),lit=abs.reduce((s,a)=>s+(a.litros||0),0);
  const pags=S.pagamentos.filter(p=>dentro(p.data)).sort((a,b)=>a.data.localeCompare(b.data));
  const rec=pags.reduce((s,p)=>s+p.valor,0);
  const harm=a=>a.length?a.length/a.reduce((s,c)=>s+1/c,0):0;
  let aberto=0,aVencer=0;const linhasP=[];
  S.pessoas.forEach(p=>{const e=extrato(p.id);const ds=e.dias.filter(d=>dentro(d.k));if(!ds.length&&!pags.some(x=>x.pid===p.id))return;
    let tr=0;ds.forEach(d=>{const v=S.viagens[d.k];tr+=(v.ida.includes(p.id)?1:0)+(v.volta.includes(p.id)?1:0)});
    const val=ds.reduce((s,d)=>s+d.valor,0),pg=ds.reduce((s,d)=>s+d.pago,0),ab=ds.filter(d=>d.k<=HOJE).reduce((s,d)=>s+d.valor-d.pago,0),av=ds.filter(d=>d.k>HOJE).reduce((s,d)=>s+d.valor-d.pago,0);
    aberto+=ab;aVencer+=av;
    linhasP.push(`    <passageiro nome="${xa(p.nome)}" tipo="${p.fixo?'fixo':'avulso'}" paga="${p.modo==='semana'?'por semana':'por dia'}" valor_ida_volta="${n2(valores(p.id).d)}" valor_trecho="${n2(valores(p.id).t)}" dias="${ds.length}" trechos="${tr}" total="${n2(val)}" pago="${n2(pg)}" em_aberto="${n2(ab)}" a_vencer="${n2(av)}"/>`)});
  L.push(`  <resumo caronas_do_mes="${n2(ger)}" recebido_no_mes="${n2(rec)}" em_aberto="${n2(aberto)}" a_vencer="${n2(aVencer)}" gasolina_abastecida="${n2(gasto)}" litros_abastecidos="${lit.toFixed(2)}" preco_medio_litro="${lit?n2(gasto/lit):''}" dias_rodados="${dias}" km_rodados="${(Math.round(kmMes*10)/10)}" gasolina_estimada_dos_dias="${n2(est)}" consumo_medio_ida="${cI.length?harm(cI).toFixed(1):''}" consumo_medio_volta="${cV.length?harm(cV).toFixed(1):''}" resultado_caronas_menos_abastecido="${n2(ger-gasto)}" resultado_caronas_menos_estimado="${n2(ger-est)}"/>`);
  L.push('  <passageiros>',...linhasP,'  </passageiros>');
  L.push('  <dias>',...linhasDia,'  </dias>');
  L.push('  <abastecimentos>',...abs.map(a=>`    <abastecimento data="${a.data}" valor="${n2(a.valor)}" preco_litro="${n2(a.preco)}" litros="${(a.litros||0).toFixed(2)}" km="${a.km||''}"/>`),'  </abastecimentos>');
  L.push('  <pagamentos>',...pags.map(x=>`    <pagamento data="${x.data}" nome="${xa(nome(x.pid))}" valor="${n2(x.valor)}" dias_pagos="${(x.dias||[]).map(k=>ddmm(fromIso(k))).join(', ')}" obs="${xa(x.obs||'')}"/>`),'  </pagamentos>');
  L.push('</relatorio_mensal>');return L.join('\n');
}

function telaHistorico(){
  const atual=iso(mondayOf(new Date()));
  const sems=[...new Set(Object.keys(S.viagens).map(k=>iso(mondayOf(fromIso(k)))))].filter(w=>w<atual).sort().reverse();
  let h=`<div class="days"><div class="card"><h2 style="font-size:1.1rem">Semanas anteriores</h2><p class="note" style="margin:4px 0 0">${sems.length?sems.length+' semana(s) guardada(s). A aba Semana mostra só a semana atual.':'Ainda não há semanas anteriores. Elas aparecem aqui sozinhas quando a semana virar.'}</p></div>`;
  sems.forEach(w=>{const seg=fromIso(w),ks=semanaKeys(seg);let rec=0,cu=0;const ps=new Set();
    ks.forEach(k=>{const v=S.viagens[k];if(!v||v.off)return;rec+=receitaDia(v);cu+=custoDiaK(k);v.ida.concat(v.volta).forEach(id=>ps.add(id))});
    h+=`<div class="person"><div class="ph"><h3>${ddmm(seg)} a ${ddmm(addDays(seg,4))}</h3><span class="spacer"></span><button class="btn sm" data-act="editsem" data-w="${w}">Corrigir</button></div>

    <details><summary class="note" style="cursor:pointer">${ps.size} passageiro(s) · ver dias</summary><div class="hist">${ks.map((k,i)=>{const v=S.viagens[k];if(!v)return '';return `<div>${DIAS[i]} ${ddmm(fromIso(k))}: ${v.off?'não fui':`ida ${esc(v.ida.map(nome).join(', ')||'—')} · volta ${esc(v.volta.map(nome).join(', ')||'—')}`}</div>`}).join('')}</div></details></div>`});
  return h+'</div>';
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-act]');if(!t||t.tagName==='SELECT'||t.type==='checkbox'||t.tagName==='INPUT')return;
  if(t.dataset.tab){tab=t.dataset.tab;if(tab==='semana')semana=mondayOf(new Date());copyText=null;try{history.replaceState(null,'','#'+tab)}catch(e){}render();return}
  const a=t.dataset.act,id=t.dataset.id;
  if(a==='sem'){semana=addDays(semana,+t.dataset.d);importPreview=null;copyText=null;render()}
  else if(a==='rm'){const v=dia(t.dataset.k);v[t.dataset.leg]=v[t.dataset.leg].filter(x=>x!==id);salvar();render()}
  else if(a==='ler'){const txt=document.getElementById('wtxt').value;const r=lerWhats(txt);if(!r.length){toast('Não achei nenhum dia na mensagem');return}importPreview=r;render();document.getElementById('wtxt').value=txt}
  else if(a==='cancelar'){importPreview=null;render()}
  else if(a==='aplicar'){
    const ks=semanaKeys(wSem);
    const pid=n=>{let p=findByName(n);if(!p){p={id:uid(),nome:n.charAt(0).toUpperCase()+n.slice(1),modo:'dia',fixo:true,tarifa:S.tarifas[0].id};S.pessoas.push(p)}return p.id};
    importPreview.forEach(d=>{const v=dia(ks[d.idx]);v.ida=[...new Set(d.ida.map(pid))];v.volta=[...new Set(d.volta.map(pid))];v.off=false});
    importPreview=null;semana=wSem;salvar();render();toast('Marcação aplicada na semana de '+ddmm(wSem))}
  else if(a==='copsem')copiar(textoSemana(wSem));
  else if(a==='copvagas'){const m=msgVagas(wSem);if(m)copiar(m)}
  else if(a==='payopen'){payOpen=payOpen===id?null:id;render()}
  else if(a==='payclose'){payOpen=null;render()}
  else if(a==='paysave'){const v=parseFloat(String(document.getElementById('pv-'+id).value).replace(',','.'));if(!(v>0)){toast('Digite o valor recebido');return}
    const dias=[...document.querySelectorAll(`input[data-act="pdia"][data-id="${id}"]:checked`)].map(c=>c.value);
    S.pagamentos.push({id:uid(),pid:id,data:document.getElementById('pd-'+id).value||HOJE,valor:Math.round(v*100)/100,dias,obs:document.getElementById('po-'+id).value.trim()});payOpen=null;salvar();render();toast('Pagamento registrado')}
  else if(a==='paydel'){S.pagamentos=S.pagamentos.filter(x=>x.id!==t.dataset.pay);salvar();render();toast('Pagamento apagado')}
  else if(a==='cobrar'){copiar(msgCobranca(pessoa(id)))}
  else if(a==='editopen'){editOpen=editOpen===id?null:id;render()}
  else if(a==='editclose'){editOpen=null;render()}
  else if(a==='psave'){const n=document.getElementById('fn-'+id).value.trim();if(!n){toast('Digite o nome');return}
    const m=document.getElementById('fm-'+id).value,f=document.getElementById('ff-'+id).value==='1',tf=document.getElementById('ft-'+id).value;
    const extra={tarifa:tf};if(tf==='proprio'){extra.valorDia=Math.max(0,parseFloat(document.getElementById('fd-'+id).value)||0);extra.valorTrecho=Math.max(0,parseFloat(document.getElementById('fv-'+id).value)||0)}
    if(id==='novo'){if(findByName(n)&&norm(findByName(n).nome)===norm(n)){toast('Já existe alguém com esse nome');return}S.pessoas.push(Object.assign({id:uid(),nome:n,modo:m,fixo:f},extra));toast('Cadastrado')}
    else Object.assign(pessoa(id),{nome:n,modo:m,fixo:f},extra);editOpen=null;salvar();render()}
  else if(a==='pdel'){editOpen='del-'+id;render()}
  else if(a==='pdelok'){S.pessoas=S.pessoas.filter(p=>p.id!==id);S.pagamentos=S.pagamentos.filter(x=>x.pid!==id);for(const k in S.viagens){const v=S.viagens[k];v.ida=v.ida.filter(x=>x!==id);v.volta=v.volta.filter(x=>x!==id)}editOpen=null;salvar();render();toast('Excluído')}
  else if(a==='cfsave'){const c=S.config;['gasolina','consumo','kmTrecho','vagas'].forEach(f=>{const v=parseFloat(document.getElementById('cf-'+f).value);if(v>0)c[f]=f==='vagas'?Math.round(v):v});['horaIda','horaVolta','rodape'].forEach(f=>{c[f]=document.getElementById('cf-'+f).value.trim()});salvar();render();toast('Ajustes salvos')}
  else if(a==='tsave'){const n=document.getElementById('tn-'+id).value.trim(),d=parseFloat(document.getElementById('td-'+id).value),v=parseFloat(document.getElementById('tv-'+id).value);
    if(!n){toast('Dê um nome para a tabela');return}if(!(d>=0)||!(v>=0)){toast('Preencha os dois valores');return}
    if(id==='novo')S.tarifas.push({id:uid(),nome:n,valorDia:d,valorTrecho:v});else Object.assign(S.tarifas.find(t=>t.id===id),{nome:n,valorDia:d,valorTrecho:v});
    salvar();render();toast(id==='novo'?'Tabela criada':'Tabela salva')}
  else if(a==='tdel'){S.pessoas.forEach(p=>{if(p.tarifa===id)p.tarifa=S.tarifas[0].id});S.tarifas=S.tarifas.filter(t=>t.id!==id);salvar();render();toast('Tabela excluída; quem usava foi para '+S.tarifas[0].nome)}
  else if(a==='mes'){const [y,m]=mes.split('-').map(Number);const d=new Date(y,m-1+(+t.dataset.d),1);mes=iso(d).slice(0,7);render()}
  else if(a==='absave'){const v=parseFloat(document.getElementById('ab-valor').value),pr=parseFloat(document.getElementById('ab-preco').value),km=parseFloat(document.getElementById('ab-km').value);
    if(!(v>0)){toast('Digite quanto pagou');return}if(!(pr>0)){toast('Digite o preço do litro');return}
    S.abastecimentos.push({id:uid(),data:document.getElementById('ab-data').value||HOJE,valor:Math.round(v*100)/100,preco:pr,litros:Math.round(v/pr*100)/100,km:km>0?Math.round(km):null});
    mes=(document.getElementById('ab-data').value||HOJE).slice(0,7);salvar();render();toast('Abastecimento salvo')}
  else if(a==='abdel'){S.abastecimentos=S.abastecimentos.filter(x=>x.id!==id);salvar();render();toast('Abastecimento apagado')}
  else if(a==='bkfile'){const b=new Blob([paraXML()],{type:'application/xml'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='caronas-backup-'+HOJE+'.xml';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);try{localStorage.setItem('caronas-ultimo-backup',HOJE)}catch(e){}}
  else if(a==='editsem'){semana=fromIso(t.dataset.w);tab='semana';try{history.replaceState(null,'','#semana')}catch(e){}render();scrollTo(0,0)}
  else if(a==='semhoje'){semana=mondayOf(new Date());render()}
  else if(a==='semprox'){semana=addDays(mondayOf(new Date()),7);render()}
  else if(a==='wsem'){wSem=addDays(mondayOf(new Date()),+t.dataset.d);importPreview=null;copyText=null;render()}
  else if(a==='relxml'){baixar('caronas-relatorio-'+mes+'.xml',relatorioXML(mes))}
  else if(a==='bkcopy')copiar(JSON.stringify(S));
  else if(a==='bkload'){try{S=lerBackup(document.getElementById('bk').value);salvar();render();toast('Dados restaurados')}catch(e){toast('Texto inválido')}}
});
// formPessoa usa editOpen para o form; ao pedir exclusão mantém o form aberto
document.addEventListener('change',e=>{
  const t=e.target;const a=t.dataset.act;
  if(a==='add'){const v=t.value;if(!v)return;const k=t.dataset.k,leg=t.dataset.leg;
    if(v==='__novo'){novaPessoaSlot=k+leg;render();document.getElementById(`np-${k}-${leg}`)?.focus();return}
    const d=dia(k);if(d[leg].length>=S.config.vagas){toast('Carro cheio nesse trecho');render();return}
    d[leg].push(v);salvar();render()}
  else if(a==='ftsel'){const b=document.getElementById('fp-'+t.dataset.id);if(b)b.hidden=t.value!=='proprio'}
  else if(a==='pdia'){const id=t.dataset.id;const tot=[...document.querySelectorAll(`input[data-act="pdia"][data-id="${id}"]:checked`)].reduce((s,c)=>s+parseFloat(c.dataset.v),0);const f=document.getElementById('pv-'+id);if(f)f.value=tot.toFixed(2)}
  else if(a==='cons'){const n=parseFloat(t.value);const d=dia(t.dataset.k);if(n>0)d[t.dataset.f]=Math.round(n*10)/10;else delete d[t.dataset.f];salvar();render()}
  else if(a==='mvagas'){S.config.mostrarVagas=t.checked;salvar();render()}
  else if(a==='off'){dia(t.dataset.k).off=t.checked;salvar();render()}
  else if(a==='obs'){dia(t.dataset.k).obs=t.value;salvar()}
});
document.addEventListener('input',e=>{if(e.target.dataset.act!=='abcalc')return;const v=parseFloat(document.getElementById('ab-valor').value),p=parseFloat(document.getElementById('ab-preco').value);document.getElementById('ab-litros').textContent=v>0&&p>0?`≈ ${(v/p).toFixed(2).replace('.',',')} litros (${(v/p*mediaConsumo().media).toFixed(0)} km, uns ${(v/p*mediaConsumo().media/(2*S.config.kmTrecho)).toFixed(1).replace('.',',')} dias de ida e volta)`:'Informe o valor pago'});
document.addEventListener('change',e=>{if(e.target.id!=='bkup'||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{try{S=lerBackup(r.result);salvar();render();toast('Dados restaurados')}catch(x){toast('Arquivo inválido')}};r.readAsText(e.target.files[0])});
document.addEventListener('keydown',e=>{
  const t=e.target;if(!t.id||!t.id.startsWith('np-'))return;
  if(e.key==='Escape'){novaPessoaSlot=null;render();return}
  if(e.key!=='Enter')return;const n=t.value.trim();if(!n)return;
  let p=findByName(n);if(!p){p={id:uid(),nome:n,modo:'dia',fixo:false,tarifa:S.tarifas[0].id};S.pessoas.push(p)}
  const d=dia(t.dataset.k);if(!d[t.dataset.leg].includes(p.id)&&d[t.dataset.leg].length<S.config.vagas)d[t.dataset.leg].push(p.id);
  novaPessoaSlot=null;salvar();render();toast(n+' adicionado(a) como avulso(a)');
});
document.addEventListener('toggle',e=>{if(e.target.id==='vagasbox')vagasOpen=e.target.open;if(e.target.dataset&&e.target.dataset.ext)extOpen=e.target.open?e.target.dataset.ext:(extOpen===e.target.dataset.ext?null:extOpen)},true);
document.addEventListener('focusout',e=>{if(e.target.id&&e.target.id.startsWith('np-')&&!e.target.value.trim()){setTimeout(()=>{novaPessoaSlot=null;render()},150)}});

iniciar();
</script>

</body></html>
